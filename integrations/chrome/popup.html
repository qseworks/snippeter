<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snippeter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg
              class="logo-mark"
              viewBox="0 0 512 512"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <linearGradient
                  id="sn-tile"
                  x1="147.8"
                  y1="24"
                  x2="364.2"
                  y2="488"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#1C1F27" />
                  <stop offset="1" stop-color="#111319" />
                </linearGradient>
                <radialGradient
                  id="sn-glow"
                  cx="328"
                  cy="246"
                  r="236"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#65EA92" stop-opacity="0.16" />
                  <stop offset="0.72" stop-color="#65EA92" stop-opacity="0" />
                </radialGradient>
                <linearGradient
                  id="sn-caret"
                  x1="0"
                  y1="0"
                  x2="0"
                  y2="34"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#7CF5A2" />
                  <stop offset="1" stop-color="#5EE38B" />
                </linearGradient>
              </defs>
              <rect width="512" height="512" rx="114" fill="url(#sn-tile)" />
              <rect width="512" height="512" rx="114" fill="url(#sn-glow)" />
              <rect
                x="1.5"
                y="1.5"
                width="509"
                height="509"
                rx="112.5"
                fill="none"
                stroke="#24272F"
                stroke-width="3"
              />
              <g transform="translate(173.02 173.02) scale(4.881)">
                <path
                  d="M0 0 L17 17 L0 34"
                  fill="none"
                  stroke="#EDEEF2"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <rect
                  x="27"
                  y="0"
                  width="11"
                  height="34"
                  rx="4"
                  fill="url(#sn-caret)"
                />
              </g>
            </svg>
          </span>
          <span class="brand-name">Snippeter</span>
        </div>
        <button
          id="signOutBtn"
          class="ghost-btn"
          type="button"
          hidden
          title="Sign out"
        >
          Sign out
        </button>
      </header>

      <!-- Sign-in view -->
      <section id="authView" class="view" hidden>
        <p class="tagline">A fast, local-first manager for code snippets &amp; AI prompts.</p>
        <form id="signInForm" class="auth-form" autocomplete="on">
          <label class="field">
            <span class="field-label">Email</span>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              placeholder="you@example.com"
              required
            />
          </label>
          <label class="field">
            <span class="field-label">Password</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </label>
          <button id="signInBtn" class="primary-btn" type="submit">
            Sign in
          </button>
          <p id="authError" class="error" role="alert" hidden></p>
        </form>
      </section>

      <!-- Snippets view -->
      <section id="listView" class="view" hidden>
        <div class="search-row">
          <input
            id="search"
            class="search"
            type="search"
            placeholder="Search snippets…"
            autocomplete="off"
            aria-label="Search snippets"
          />
          <button id="refreshBtn" class="ghost-btn" type="button" title="Refresh">
            ↻
          </button>
        </div>

        <div id="status" class="status" hidden></div>

        <ul id="snippetList" class="snippet-list" aria-label="Your snippets"></ul>

        <div id="emptyState" class="empty" hidden>
          <p class="empty-title">No snippets yet</p>
          <p class="empty-sub">
            Select text on any page, right-click, and choose
            “Save selection to Snippeter”.
          </p>
        </div>
      </section>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
