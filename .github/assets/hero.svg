<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img" aria-label="Terminal typing: snippets and AI prompts, everywhere">
  <title>Snippeter — snippets &amp; AI prompts, everywhere</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65EA92"/>
      <stop offset="1" stop-color="#2FBF71"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    .type {
      clip-path: inset(-10px 100% -10px 0);
      animation: typing 2.8s steps(33, end) 0.8s forwards;
    }
    @keyframes typing { to { clip-path: inset(-10px 0 -10px 0); } }
    .caret {
      animation: track 2.8s steps(33, end) 0.8s forwards,
                 blink 1.2s step-end 3.8s infinite;
    }
    @keyframes track { from { transform: translateX(0); } to { transform: translateX(363px); } }
    @keyframes blink { from { opacity: 1; } 50% { opacity: 0; } }
    .status { opacity: 0; animation: fadein 0.6s ease 3.9s forwards; }
    @keyframes fadein { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .type, .caret, .status { animation: none; }
      .type { clip-path: none; }
      .caret { transform: translateX(363px); }
      .status { opacity: 1; }
    }
  </style>

  <!-- terminal window -->
  <rect x="0.5" y="0.5" width="719" height="119" rx="16" fill="#0B0C0F" stroke="#23262B"/>
  <path d="M0.5 32 H719.5" stroke="#191C20" stroke-width="1"/>
  <circle cx="26" cy="16.5" r="5" fill="#2E3238"/>
  <circle cx="44" cy="16.5" r="5" fill="#2E3238"/>
  <circle cx="62" cy="16.5" r="5" fill="#2E3238"/>
  <text x="82" y="21" class="mono" font-size="12" fill="#6A7178">~ snippeter</text>

  <!-- prompt line -->
  <text x="32" y="78" class="mono" font-size="20" font-weight="700" fill="url(#g)">&gt;</text>
  <text x="56" y="78" class="mono type" font-size="17" fill="#E6E8EB" textLength="363" lengthAdjust="spacing">snippets &amp; AI prompts, everywhere</text>

  <!-- block caret: tracks the typing, then blinks -->
  <rect x="56" y="62" width="10" height="20" rx="1.5" fill="#65EA92" class="caret"/>

  <!-- status line fades in when typing completes -->
  <text x="56" y="103" class="mono status" font-size="13" fill="#8B919A"><tspan fill="#65EA92">✓</tspan> saved — searchable on all 6 platforms</text>
</svg>
